name: CPU regression checks


on:
  push:

  pull_request:


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the complete history for baseline comparisons
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - name: Install CPU development dependencies
        run: make install EXTRAS=dev

      - name: Run regression tests, style checks, and CLI smoke checks
        run: make check
