name: ci - tests


on:
  push:

  pull_request:


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - name: install deps
        run: make install EXTRAS=dev

      - name: run checks
        run: make check
